name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Nightly, independent of `bot/**` PR activity — pip-audit's vulnerability
  # database moves even when no code changes (ADR-4 BD-7: "pip-audit | Every
  # PR + nightly"). `bot-audit` has no `if:` guard so it runs on every
  # trigger; the other four jobs skip the schedule trigger to avoid a
  # pointless nightly re-run of unrelated gates.
  schedule:
    - cron: "0 4 * * *" # nightly, 04:00 UTC

permissions: {}

jobs:
  schema-validate:
    name: schema-validate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - name: task schema:validate
        run: task schema:validate

  bot-lint:
    name: bot-lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - name: task bot:lint
        run: task bot:lint

  bot-test:
    name: bot-test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - name: task bot:test
        run: task bot:test

  bot-audit:
    name: bot-audit
    # The only job here a `schedule` can reach, so the only one needing the
    # upstream guard (cron is upstream-only -- see render-deploy.yml's
    # `guard`). PR and push behaviour is unchanged, forks included.
    if: github.event_name != 'schedule' || github.repository_owner == 'ocx-sh'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - name: task bot:audit
        run: task bot:audit

  workflows-lint:
    name: workflows-lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - name: task workflows:lint
        run: task workflows:lint

  # KNOWN GAP (plan_catalog_extraction WP-11): `site:build` depends on
  # `cat:build`, which builds `@ocx-sh/catalog` from a SIBLING checkout
  # (`../ocx-catalog`, taskfile.yml's CATALOG_PKG_DIR) — that repo is local-
  # only (no GitHub remote yet, plan_catalog_extraction WP-01) and this job
  # checks out only `index`, so this job is RED until `@ocx-sh/catalog`
  # either publishes to npm (plan WP-12, at which point the root
  # package.json's `file:../ocx-catalog` becomes a real registry version
  # and needs no sibling checkout) or gets a real remote this job can
  # `actions/checkout` alongside `index`. Left wired to the real `task
  # site:build` command (not skipped/stubbed) so it goes green automatically
  # the moment either fix lands — never silently paper over the gap by
  # weakening what this job asserts.
  site-build:
    name: site-build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      # task-only — no uv/Python, so this skips setup-bot (scoped to the
      # indexbot toolchain) and installs just the Task binary directly.
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          version: "3.x"
          repo-token: ${{ github.token }}
      # SHA verified 2026-07-17 against oven-sh/setup-bun's own release
      # tag+commit (`gh api repos/oven-sh/setup-bun/git/ref/tags/v2.2.0` and
      # `gh api repos/oven-sh/setup-bun/commits/<sha>` both resolve to this
      # SHA) and cross-checked against the SHA ocx-sh/ocx's
      # website deploy workflow (`.github/workflows/deploy-website.yml`)
      # already pins for the same tag.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      # `npm` (for `task cat:build`'s `npm ci && npm run build`) ships
      # pre-installed on the `ubuntu-latest` GitHub-hosted runner image, at
      # a version already satisfying `@ocx-sh/catalog`'s own `engines.node`
      # (>=20.19) — no separate setup-node action needed, one less
      # SHA-pinned dependency to carry.
      - name: task site:build
        run: task site:build

  # Same KNOWN GAP as site-build above — golden-baseline.sh's pipeline
  # (task demo:seed / render:build RENDER_INDEX_DIR=demo) runs through
  # site:build too.
  golden-baseline:
    name: golden-baseline
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - name: golden-baseline generate
        run: bash scripts/golden-baseline.sh generate

  # Same KNOWN GAP as site-build above -- `task render:build` runs
  # `site:build` (-> `cat:build`, sibling-checkout dependency) first.
  render-check:
    name: render-check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - name: task render:build
        run: task render:build
      - name: task schema:validate:rendered
        run: task schema:validate:rendered
