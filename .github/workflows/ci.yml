name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Nightly, independent of `bot/**` PR activity — pip-audit's vulnerability
  # database moves even when no code changes (ADR-4 BD-7: "pip-audit | Every
  # PR + nightly"). `bot-audit` has no `if:` guard so it runs on every
  # trigger; the other four jobs skip the schedule trigger to avoid a
  # pointless nightly re-run of unrelated gates.
  schedule:
    - cron: "0 4 * * *" # nightly, 04:00 UTC

permissions: {}

jobs:
  schema-validate:
    name: schema-validate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - name: task schema:validate
        run: task schema:validate

  bot-lint:
    name: bot-lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - name: task bot:lint
        run: task bot:lint

  bot-test:
    name: bot-test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - name: task bot:test
        run: task bot:test

  bot-audit:
    name: bot-audit
    # The only job here a `schedule` can reach, so the only one needing the
    # upstream guard (cron is upstream-only -- see render-deploy.yml's
    # `guard`). PR and push behaviour is unchanged, forks included.
    if: github.event_name != 'schedule' || github.repository_owner == 'ocx-sh'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - name: task bot:audit
        run: task bot:audit

  workflows-lint:
    name: workflows-lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - name: task workflows:lint
        run: task workflows:lint

  # The plain catalog-package build that used to live here as `site-build`
  # is now the `build` job of the RENDERED .github/workflows/catalog-ci.yml
  # (`ocx-catalog ci`, driven by catalog.config.json's `ci` block —
  # plan_catalog_extraction WP-11 dogfooding). Once `@ocx-sh/catalog`
  # publishes to npm, `task site:build` collapses to exactly the
  # `ocx-catalog build` that rendered job runs, so keeping both here would
  # be duplicate CI minutes for one assertion. The parts of `task
  # site:build` the rendered job does NOT cover — the jq/RENDER_INDEX_DIR
  # plumbing and `--out` — stay covered by `render-check` below, which
  # calls `site:build` as its first step.
  #
  # KNOWN GAP (plan_catalog_extraction WP-11), applying to every job below
  # AND to the rendered catalog-ci.yml: `site:build` depends on `cat:build`,
  # which builds `@ocx-sh/catalog` from a SIBLING checkout (`../ocx-catalog`,
  # taskfile.yml's CATALOG_PKG_DIR) — that repo is local-only (no GitHub
  # remote yet, plan_catalog_extraction WP-01) and these jobs check out only
  # `index`, so they are RED until `@ocx-sh/catalog` either publishes to npm
  # (plan WP-12, at which point the root package.json's
  # `file:../ocx-catalog` becomes a real registry version and needs no
  # sibling checkout) or gets a real remote a job can `actions/checkout`
  # alongside `index`. Left wired to the real commands (not skipped or
  # stubbed) so they go green automatically the moment either fix lands —
  # never silently paper over the gap by weakening what they assert.
  golden-baseline:
    name: golden-baseline
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - name: golden-baseline generate
        run: bash scripts/golden-baseline.sh generate

  # Same KNOWN GAP as above -- `task render:build` runs `site:build`
  # (-> `cat:build`, sibling-checkout dependency) first. Also the only job
  # left covering `site:build`'s jq/RENDER_INDEX_DIR + `--out` plumbing,
  # which the rendered catalog-ci.yml `build` job does not exercise.
  render-check:
    name: render-check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - name: task render:build
        run: task render:build
      - name: task schema:validate:rendered
        run: task schema:validate:rendered
