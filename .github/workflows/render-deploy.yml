name: render-deploy

on:
  push:
    branches: [main]
  # An announce merged by auto-merge is pushed with GITHUB_TOKEN, and a push
  # made with GITHUB_TOKEN triggers no workflow -- so `push` above never fires
  # for the machine lane. Before the lane existed a human merged every announce
  # and this deployed as a side effect; afterwards #64 and #66 both merged and
  # published nothing, and index.ocx.sh served a stale tree with no failing
  # check anywhere (issue #67). The schedule is the trigger a bot merge does
  # reach. `guard` below keeps the cost to one cheap job per tick when main has
  # not moved.
  #
  # `*/15` is a request, NOT a guarantee, and the gap between the two is large
  # enough to matter when sizing how stale index.ocx.sh may be. Measured over
  # 2026-07-26T17:44Z..2026-07-27T04:55Z (11.2 h): 8 scheduled runs where the
  # cron asks for 45 -- 18%. Successive gaps, minutes:
  #   61, 85, 62, 62, 75, 103, 222
  # Median 75, floor 61, worst 222 (3.7 h). GitHub drops scheduled runs under
  # load and never backfills, so the realistic figure is hourly-ish, and the
  # tail is hours. Read "up to a few hours", not "up to 15 minutes". Tightening
  # the cron does not help -- the floor is already 4x the interval.
  #
  # Do not try to close this with a bot-fired dispatch. `workflow_dispatch` and
  # `repository_dispatch` ARE the documented exceptions to the GITHUB_TOKEN
  # recursion guard, so firing one from a job does work -- but nothing
  # bot-initiated survives the merge to call it: `pull_request` `closed` is not
  # an exception, so no post-merge event runs at all. Chaining `workflow_run`
  # off the PR's checks and polling for the merge reintroduces a race, which is
  # the same failure mode as #67.
  #
  # Merging under a non-GITHUB_TOKEN identity would make `push` above fire as
  # designed, and is ruled out: the announce bot opens a pull request from its
  # fork and holds no write access here. Any fix must work without granting it
  # any. Tracked in #67.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

# Replaces deploy.yml (Phase 3, WP3-A): renders the wire tree from p/ into
# site/.vitepress/dist instead of deploying the tracked public/ placeholder
# verbatim. The domain/DNS self-activation block below is ported VERBATIM
# from deploy.yml (battle-tested across PRs #2-#5) -- do not redesign it
# here, only the build+deploy source changed.
jobs:
  # Answers one question: is main already deployed? A push or a manual dispatch
  # is always a deliberate "deploy this", so both short-circuit to true; only
  # the 15-minute tick has to look. The comparison is against the head sha of
  # the last SUCCESSFUL run of this workflow -- a failed deploy therefore
  # retries on the next tick instead of being recorded as done.
  guard:
    name: guard
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Decide whether main is already deployed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then
            echo "$EVENT is an explicit deploy request -- not consulting run history."
            echo "should_deploy=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # --status success excludes this very run, which is in_progress.
          last="$(gh run list --repo "$REPO" --workflow render-deploy.yml \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [ "$last" = "$HEAD_SHA" ]; then
            echo "main ($HEAD_SHA) already deployed by the last successful run -- skipping."
            echo "should_deploy=false" >>"$GITHUB_OUTPUT"
          else
            echo "main ($HEAD_SHA) differs from last successful deploy (${last:-none}) -- deploying."
            echo "should_deploy=true" >>"$GITHUB_OUTPUT"
          fi

  deploy:
    name: deploy
    needs: guard
    if: needs.guard.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-pages
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      # no-cache: this job's own steps below publish to Cloudflare Pages
      # (cloudflare/wrangler-action) -- default action caching here would be
      # a cache-poisoning vector into that publish step (zizmor
      # cache-poisoning finding, high). Bun-executable download is cheap;
      # not worth the exposure.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      # ADR (adr_catalog_docs_colocation.md) "Build pipeline order" -- fixed,
      # non-reorderable sequence (reshaped by plan_site_redesign WP-bot/
      # WP-ci: dynamic routes replaced the bot-generated wrapper pages this
      # comment used to describe as a first step): `bun run build` (VitePress
      # `emptyOutDir: true` wipes site/.vitepress/dist clean, compiling
      # site/src/[ns]/[pkg].paths.ts's dynamic routes straight from the
      # committed p/*/*.json tree) -> `indexbot render --out` (config.json +
      # /p/** + /c/index.json + /data/catalog/catalog.json, written INTO the
      # same freshly-emptied tree). Swapping the two steps silently deletes
      # the wire JSON on the next deploy -- see taskfile.yml's render:build
      # target, which encodes this order, not this workflow directly.
      - name: task render:build
        run: task render:build
      - name: task schema:validate:rendered
        run: task schema:validate:rendered

      # Idempotent: fails harmlessly if the project already exists.
      - name: Ensure Pages project
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ocx-index --production-branch=main

      - name: Deploy rendered tree to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/.vitepress/dist --project-name=ocx-index --branch=main

      # Canonical index endpoint: index.ocx.sh (ADR Amendment A1 — ocx.sh stays
      # canonical, ocx.rs parked). The ocx.sh zone is NOT on Cloudflare yet, so
      # the canonical attach self-activates: zone looked up by name at runtime,
      # step no-ops until the zone (and token scope for it) exists.
      # index.ocx.rs stays attached as the live bootstrap endpoint until the
      # cutover; detach it at ocx.rs parking time. Check-then-act idempotent.
      - name: Ensure custom domains + DNS records
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_OCXRS: e7e05c1d7edc241e4a7fde08e423483f # ocx.rs zone id (bootstrap)
        run: |
          set -euo pipefail
          domains="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/ocx-index/domains"
          auth="Authorization: Bearer $CF_TOKEN"
          json="Content-Type: application/json"

          ensure_domain_and_cname() { # $1=fqdn $2=record-name $3=zone-id
            if ! curl -sS -H "$auth" "$domains" | jq -e --arg d "$1" 'any(.result[]?; .name==$d)' >/dev/null; then
              curl -sS -X POST -H "$auth" -H "$json" "$domains" --data "{\"name\":\"$1\"}" | jq -e '.success'
            fi
            recs="https://api.cloudflare.com/client/v4/zones/$3/dns_records"
            if ! curl -sS -H "$auth" "$recs?type=CNAME&name=$1" | jq -e --arg d "$1" 'any(.result[]?; .name==$d)' >/dev/null; then
              curl -sS -X POST -H "$auth" -H "$json" "$recs" \
                --data "{\"type\":\"CNAME\",\"name\":\"$2\",\"content\":\"ocx-index.pages.dev\",\"proxied\":true,\"comment\":\"OCX index endpoint to Pages\"}" \
                | jq -e '.success'
            fi
          }

          # Bootstrap endpoint (live today).
          ensure_domain_and_cname "index.ocx.rs" "index" "$CF_ZONE_OCXRS"

          # Canonical endpoint — self-activates once the ocx.sh zone is on
          # Cloudflare AND the API token can read/edit it.
          zone_ocxsh=$(curl -sS -H "$auth" \
            "https://api.cloudflare.com/client/v4/zones?name=ocx.sh" \
            | jq -r '.result[0].id // empty' || true)
          if [ -n "$zone_ocxsh" ]; then
            ensure_domain_and_cname "index.ocx.sh" "index" "$zone_ocxsh"
          else
            echo "ocx.sh zone not visible to this token yet — skipping canonical domain attach."
          fi

  smoke:
    name: smoke
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # --allow-empty: pre-seed state (no p/ roots committed yet, Phase 4) —
      # the digest-chain section tolerates a config.json-only deploy; every
      # other check (ETag, cache-rule, catalog, docs) still runs and still
      # contributes to the exit code.
      - name: scripts/smoke-test.sh
        run: scripts/smoke-test.sh https://index.ocx.sh --allow-empty
