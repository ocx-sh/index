name: validate

# The UNPRIVILEGED half of ADR-4 (adr_index_bot_and_workflow_security.md)
# BD-5's privileged/unprivileged split, extended by ADR-6
# (adr_fork_pr_announce.md) for the fork-PR announce lane. The privileged half
# — `governance-gate` + `arm-auto-merge` + `deploy-on-merge` on
# `pull_request_target` — lives in `governance.yml`.
#
# One trigger per workflow, and that is a security property, not tidiness.
# Both halves used to live in this file, which declared BOTH `pull_request`
# and `pull_request_target` with a job-level `if: github.event_name == ...`
# picking the half to run. A job skipped by such an `if:` still emits a check
# run — conclusion `skipped` — under its own name, so every
# `pull_request_target` run published a SKIPPED check run named
# `schema-validate-pr`: exactly the context branch protection requires on
# `main`. GitHub treats `skipped` as satisfying a required check and resolves
# duplicate-named contexts to the most recent, so re-running the
# `pull_request_target` half after a red validation turned the required
# context green with nothing validated — and a first-time fork contributor's
# `pull_request` run, held in `action_required`, materialises no job-level
# check runs at all, leaving the skipped one as the context's ONLY bearer.
# Since ND-4's `--allow-reserved-namespace` is withheld from fork PRs (below),
# that context is the only thing stopping a fork claiming `p/ocx/**`.
# Trigger-disjoint workflows make the collision structurally impossible.
# Pinned by bot/tests/security/test_workflow_split.py.
#
#   schema-validate-pr (zero secrets, checks out PR head — safe, GitHub strips
#     secrets for this trigger): schema/fixture check + indexbot validate
#     against this PR's changed p/**/*.json roots. `indexbot validate` also
#     byte-verifies every CAS file under each changed root's `o/sha256/` tree
#     and re-derives every claimed tag/desc-blob digest from registry truth
#     (ADR-6 FP-1/FP-4) — no extra file-listing step needed here, the CLI
#     walks the CAS tree itself from the root path it's given.
#
# The job is named "schema-validate-pr", not ADR-4's literal
# "schema-validate", because ci.yml already owns that name for a different,
# unrelated check (schema/*.schema.json + fixtures only, not this PR's diff).
# It is on main's required-check list (owner gate G-8); renaming it means
# updating branch protection in the same change.

on:
  pull_request:

permissions: {}

jobs:
  schema-validate-pr:
    name: schema-validate-pr
    runs-on: ubuntu-latest
    concurrency:
      group: schema-validate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read # checkout PR head + local git diff only, no write ever needed
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bot
      - name: task schema:validate
        run: |
          set -euo pipefail
          # Observability floor (BCR #176): a publisher-visible failure never
          # exits with a bare error — on non-zero it emits a structured
          # ::error annotation AND a job-summary block, then preserves the
          # exit so the required check still fails (exit-code contract intact).
          if task schema:validate 2>&1 | tee schema-validate.log; then
            ec=0
          else
            ec=$?
          fi
          if [ "$ec" -ne 0 ]; then
            reason="schema/fixture validation failed (exit $ec) - a schema, a valid fixture, or an invalid fixture did not behave as required. See the log tail below."
            echo "::error title=indexbot schema:validate failed::$reason"
            {
              echo "## indexbot schema:validate failed"
              echo ""
              echo "$reason"
              echo ""
              echo '```'
              tail -n 20 schema-validate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$ec"

      - name: Determine changed p/<namespace>/<package>.json files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Exactly two path segments under p/ — a package root, never a CAS
          # object (p/<ns>/<pkg>/o/sha256/<hex>.json) or anything else.
          # `:(glob)` is load-bearing — do NOT "simplify" it back to a plain
          # pathspec. A git pathspec is not a shell glob: its `*` matches `/`
          # too, so bare 'p/*/*.json' also selects every CAS object a PR adds
          # and hands it to `indexbot validate`, which rejects it as a
          # malformed root. Since every announce PR adds a CAS object, that
          # failed this required check on every announce PR. The magic
          # switches on FNM_PATHNAME, where `*` stops at `/`.
          #
          # Three-dot (merge-base..HEAD), never two-dot — also load-bearing.
          # Two-dot compares TREES, so an announce branch cut moments before
          # another announce merged saw every root main updated since its
          # branch point as "changed" and re-verified the STALE HEAD COPY of
          # other packages against registry truth — digest-mismatch on roots
          # this PR never touched and whose stale bytes a squash merge can
          # never land (PRs #351/#423/#538). Three-dot selects exactly the
          # files the PR authored — the same file set the privileged
          # governance-gate classifies via the GitHub API, so the two halves
          # judge the same diff.
          # `--diff-filter=d` (everything but deletes), not an allowlist: a
          # root swapped for a symlink is status T, which ACMR silently
          # dropped — zero roots selected, validate skipped, required check
          # green. There is nothing to validate about a delete; every other
          # status must reach `indexbot validate`.
          # Pinned by bot/tests/security/test_workflow_pathspec.py.
          changed="$(git diff --name-only --diff-filter=d "$BASE_SHA...HEAD" -- ':(glob)p/*/*.json')"
          if [ -z "$changed" ]; then
            echo "::notice title=indexbot validate::No p/<namespace>/<package>.json changes in this PR (p/ may not be seeded yet) - skipping indexbot validate."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ponytail: random-ish delimiter, not attacker-input-hardened crypto
          # — these are repo-tree filenames from an already-checked-out PR
          # diff, not a client_payload field. Collision just self-corrupts
          # this unprivileged, secret-less job's own output parsing.
          delim="INDEXBOT_CHANGED_FILES_$(date +%s%N)"
          if grep -qxF "$delim" <<<"$changed"; then
            reason="changed-file list collided with the output delimiter - retry the run (astronomically unlikely; a timestamped delimiter matched a literal filename)."
            echo "::error title=indexbot validate: changed-file detection failed::$reason"
            printf '## indexbot validate: changed-file detection failed\n\n%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "$reason" >&2
            exit 1
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<$delim"
            printf '%s\n' "$changed"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Materialize each changed root's base-ref bytes
        id: base
        if: steps.changed.outputs.has_changes == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          # ADR-2 ND-4 gates CLAIMING a reserved segment, not UPDATING a root
          # already committed under one — `indexbot validate` needs the
          # BASE-ref bytes of each changed root to tell those apart, and to
          # bound the exemption to an announce-shaped change (its
          # `--base-dir`). Written OUTSIDE the workspace: the PR-head tree is
          # what `validate` byte-compares against its own canonical
          # serialization, and must stay exactly as checked out. A root that
          # does not exist at the base ref is simply not written, so `validate`
          # sees no base bytes and treats it as a new claim (fail-closed).
          base_dir="$RUNNER_TEMP/indexbot-base"
          rm -rf "$base_dir"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            git cat-file -e "$BASE_SHA:$file" 2>/dev/null || continue
            mkdir -p "$base_dir/$(dirname "$file")"
            git show "$BASE_SHA:$file" > "$base_dir/$file"
          done <<< "$CHANGED_FILES"
          echo "dir=$base_dir" >> "$GITHUB_OUTPUT"

      - name: indexbot validate
        if: steps.changed.outputs.has_changes == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          # ND-4's reserved-brand carve-out (`--allow-reserved-namespace`),
          # gated on PR provenance. `ocx` is a RESERVED_BRAND_SEGMENT, so the
          # operator's own first-party roots (p/ocx/cli.json, p/ocx/mirror.json)
          # cannot be validated without it — but passing it unconditionally
          # would hand every fork PR the right to claim p/ocx/**, i.e. to
          # publish under the index's own brand and be believed by any client
          # that resolves `ocx.sh/ocx/*` through this index. A fork PR's head
          # repository is never this repository, so the flag is withheld there
          # and `check_namespace_not_reserved` rejects the claim exactly as it
          # does today. A null `head.repo` (deleted fork) compares unequal too
          # — fail closed. Branch-internal PRs still land in the human lane:
          # a brand-new root classifies `new-package` (G-04) and carries the
          # `governance/review-required` status nothing auto-resolves, so a
          # person merges it.
          #
          # The flag governs CLAIMING only. A fork PR that merely UPDATES a
          # root already committed under a reserved segment — the
          # `ocx package announce --fork` re-announce lane, which can open
          # nothing but fork PRs — is admitted by `--base-dir` below without
          # the flag, and only while the change stays announce-shaped
          # (`core/diff.classify_change` == "refresh"). Pinned by
          # bot/tests/security/test_workflow_split.py.
          SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          BASE_DIR: ${{ steps.base.outputs.dir }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$CHANGED_FILES"
          reserved=()
          if [ "$SAME_REPO_PR" = "true" ]; then
            reserved+=(--allow-reserved-namespace)
          fi
          # `indexbot`'s own main() already lands a structured reason on the
          # job summary for any IndexBotError it maps (register §5 chokepoint).
          # This workflow wrapper is the belt to that suspenders: it emits the
          # ::error annotation the checks UI surfaces AND captures the reason
          # even when the CLI dies on a non-IndexBotError traceback (which
          # main() deliberately does not swallow, so it writes no summary).
          if uv run --project bot -- indexbot validate --base-dir "$BASE_DIR" "${reserved[@]}" "${files[@]}" 2>&1 | tee indexbot-validate.log; then
            ec=0
          else
            ec=$?
          fi
          if [ "$ec" -ne 0 ]; then
            reason="indexbot validate rejected this PR's package roots (exit $ec). See the log tail below and the CLI's own summary block above."
            echo "::error title=indexbot validate failed::$reason"
            {
              echo "## indexbot validate failed"
              echo ""
              echo "$reason"
              echo ""
              echo '```'
              tail -n 20 indexbot-validate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$ec"
