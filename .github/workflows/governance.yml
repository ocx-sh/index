name: governance

# The privileged half of ADR-4 (adr_index_bot_and_workflow_security.md) BD-5's
# privileged/unprivileged split, extended by ADR-6 (adr_fork_pr_announce.md)
# for the fork-PR announce lane. The unprivileged half — `schema-validate-pr`,
# the required check that reads THIS PR's own `p/**` diff — lives in
# `validate.yml` on the `pull_request` trigger.
#
# The split is one-workflow-per-trigger, and that is a security property, not
# tidiness. Both halves used to live in one workflow that declared BOTH
# `pull_request` and `pull_request_target`, with a job-level
# `if: github.event_name == ...` picking which half ran. A job skipped by such
# an `if:` still emits a check run — with conclusion `skipped` — under its own
# name, so every `pull_request_target` run published a SKIPPED check run named
# `schema-validate-pr`, the exact context branch protection requires on `main`.
# GitHub treats `skipped` as satisfying a required check and resolves
# duplicate-named contexts to the most recent one, so re-running the
# `pull_request_target` half after a red validation turned the required
# context green without validating anything (and for a first-time fork
# contributor, whose `pull_request` run is held in `action_required` and
# materialises NO job-level check runs at all, the skipped one was the only
# bearer of the context). Two trigger-disjoint workflows make the collision
# structurally impossible: nothing here is named `schema-validate-pr`, and no
# job in either file is skipped for trigger reasons.
# Pinned by bot/tests/security/test_workflow_split.py.
#
#   governance-gate (GITHUB_TOKEN only, NEVER checks out PR head): classifies
#     the diff via the GitHub API only, labels the PR, sets the
#     "governance/review-required" commit status (G-19 owners-membership +
#     G-20 reviewer assignment), and publishes `indexbot governance-check`'s
#     own `disposition` as a job output. It holds `contents: read` and nothing
#     more.
#   arm-auto-merge (checkout-free): the only job that holds `contents: write`,
#     because arming or withdrawing auto-merge is a deferred write to the base
#     branch. It arms strictly on governance-gate's `disposition` — never on
#     the raw classify-pr label, which can't see the G-19 ownership result —
#     and withdraws again the moment a re-run says the PR is no longer
#     machine-lane. GitHub itself merges once branch protection's required
#     checks are green — no polling, no second bot.
#   deploy-on-merge (checkout-free, `actions: write` and nothing else): the
#     machine lane's deploy trigger. GitHub performs the armed merge with
#     GITHUB_TOKEN, whose push starts no workflow run, so `render-deploy`'s
#     `push` trigger never fires for this lane (#67). This job stays alive
#     across the merge and fires the one trigger that IS exempt from that
#     recursion guard — `workflow_dispatch`. It can merge nothing and write
#     nothing; losing it costs the fast path only.
#
# "governance/review-required" is deliberately NOT a required check and must
# not become one: governance-check reports it `pending` for every human-lane
# PR and nothing re-runs it green after approval, so requiring it would
# deadlock the human lane permanently. No job in this file may be added to
# the required-check list either: `arm-auto-merge`'s superseded pending runs
# and `deploy-on-merge`'s superseded polls are cancelled by design — and
# `deploy-on-merge` waits ON the required checks, so requiring it would
# deadlock the machine lane against itself.
#
# One consequence of that design, accepted rather than scoped away: a
# cancelled JOB sets the whole RUN's conclusion. A superseded `deploy-on-merge`
# poll therefore makes an otherwise clean governance run conclude `cancelled`
# (live: run 30246486520 — governance-gate success, arm-auto-merge success,
# deploy-on-merge cancelled → run `cancelled`; before this job existed the
# same run would have read `success`). Both escapes are worse than the flip:
# dropping `cancel-in-progress` stacks a second 25-minute poll behind the
# first and dispatches the deploy twice, and moving the job into its own
# workflow duplicates the privileged `pull_request_target` gate it reads
# `disposition` from. The flip is also the honest signal — that run really
# did not finish every job it started.
#
# So the RUN-level conclusion of this workflow carries no governance meaning
# and must not be audited or alerted on. Read the per-job conclusions instead
# (`gh run view <id> --json jobs`): `governance-gate` and `arm-auto-merge` are
# the ones that mean something, and a `cancelled` on either is the pending-job
# supersession described one paragraph up, never a withdrawal that was skipped.

on:
  # zizmor: ignore[dangerous-triggers] ADR-4 BD-5's deliberate privileged
  # split: governance-gate never checks out PR-head content (default base-ref
  # checkout, verified below), never runs PR-controlled code, and only ever
  # reads the diff through the GitHub API — the exact posture this audit
  # otherwise warns is usually missing.
  pull_request_target:

permissions: {}

jobs:
  governance-gate:
    name: governance-gate
    runs-on: ubuntu-latest
    # Serialize per-PR: BD-5 Risk 1 flags label/status races between
    # concurrent classification runs (e.g. two rapid pushes) as untested
    # territory. Queuing (not cancelling) avoids a run being cut off between
    # its label-apply and status-set steps.
    concurrency:
      group: governance-gate-${{ github.event.pull_request.number }}
    outputs:
      disposition: ${{ steps.governance_check.outputs.disposition }}
    permissions:
      contents: read # checkout base ref only, to run bot/'s source
      pull-requests: write # classify-pr's add_labels + G-20 reviewer assignment
      statuses: write # governance-check's set_commit_status (governance/review-required); a separate scope from pull-requests
      issues: write # governance-check's create_comment (G-20) posts via the Issues API even for a PR — pull-requests: write alone 403s it
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # pull_request_target's default checkout ref is the BASE branch tip —
      # deliberately left unset (never github.event.pull_request.head.sha).
      # This job only ever runs base-branch code against an API-derived diff.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bot

      - name: indexbot classify-pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --project bot -- indexbot classify-pr --pr-number "$PR_NUMBER"

      - name: indexbot governance-check
        id: governance_check
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --project bot -- indexbot governance-check --pr-number "$PR_NUMBER"

  arm-auto-merge:
    name: arm-auto-merge
    needs: governance-gate
    # Withdrawal is fail-closed, so this job must not inherit the default
    # `success()` a `needs:` implies: a governance-gate that *errors* (API 5xx,
    # a malformed base-ref root, a `uv` resolution failure) would skip this job
    # and leave an already-armed PR armed on a stale evaluation. `!cancelled()`
    # keeps it reachable; a failed gate publishes an empty `disposition`, which
    # takes the withdraw branch below and can never take the arm branch. No
    # `github.event_name` half is needed (or wanted) here — this workflow has
    # exactly one trigger, and a trigger-discriminating `if:` is precisely the
    # skipped-check-run hazard the file header describes.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Serialize per PR, so a stale arm can never land after a fresh withdraw:
    # arm jobs become eligible in gate-completion order, and a queue without
    # cancel-in-progress preserves that order. Deliberately its OWN group and
    # not governance-gate's: GitHub cancels "any previously pending job or
    # workflow in the concurrency group" when a new one queues, so sharing the
    # gate's group would let a newly eligible arm job cancel a still-pending
    # gate for a newer head — reintroducing the very stale arm this
    # serialization exists to prevent. Never add this job to the required-check
    # list: a superseded pending run is cancelled by design.
    concurrency:
      group: arm-auto-merge-${{ github.event.pull_request.number }}
    # No checkout, ever. This job's entire body is `gh` calls against
    # base-authored YAML, so the contents: write it must hold to arm a
    # deferred merge is never in scope for PR-controlled code, `uv`
    # resolution, or the third-party action setup-bot forwards github.token
    # to. Pinned by bot/tests/security/test_workflow_split.py.
    permissions:
      # Enabling or withdrawing auto-merge IS a deferred write to the base
      # branch — GitHub documents its REST sibling
      # (PUT /repos/{owner}/{repo}/pulls/{n}/merge) as needing Contents:
      # write. Granting it here rather than widening governance-gate is the
      # entire point of the split above.
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      # G-19: arm auto-merge only on governance-check's own `disposition`
      # output — that's the ownership-checked machine-lane result (refresh
      # classification AND the PR author owns every touched root), not the
      # raw classify-pr label, which cannot see the G-19 outcome.
      - name: Enable auto-merge for machine-lane PRs (G-19)
        if: needs.governance-gate.outputs.disposition == 'success'
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash

      # Arming is revocable, and must be: governance-gate re-runs and
      # re-classifies on every `synchronize`, so a PR that armed as
      # machine-lane and then pushed an edit outside the author's owned roots
      # has its arming withdrawn here rather than merging on a stale
      # evaluation.
      - name: Withdraw auto-merge — human lane
        if: needs.governance-gate.outputs.disposition != 'success'
        run: |
          set -euo pipefail
          # Read the state first, then let failure be failure. The ordinary
          # human-lane PR was never armed, and --disable-auto errors on that —
          # but so does a denied or transient call on a PR that IS armed, and
          # absorbing both would leave the PR armed behind a green check. The
          # `gh pr view` distinguishes them; neither call is guarded.
          armed="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json autoMergeRequest -q .autoMergeRequest)"
          if [ "$armed" = "null" ]; then
            echo "::notice title=auto-merge::PR #$PR_NUMBER is not machine-lane (G-19) - human review required, no auto-merge was armed."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto
          echo "::notice title=auto-merge::PR #$PR_NUMBER is no longer machine-lane (G-19) - auto-merge withdrawn, human review required."

  deploy-on-merge:
    name: deploy-on-merge
    needs: [governance-gate, arm-auto-merge]
    if: needs.governance-gate.outputs.disposition == 'success'
    runs-on: ubuntu-latest
    # The whole point is to outlive the merge, so the ceiling is generous;
    # the loop below stops itself at 25 min so its own warning gets printed
    # instead of being cut off by this.
    timeout-minutes: 30
    # NOT arm-auto-merge's group, and cancel-in-progress on purpose. Sharing
    # the arm group would park a fresh withdrawal behind this job's 25-minute
    # wait, which is exactly the stale-arm window that serialization exists to
    # prevent. A `synchronize` supersedes the poll instead: the newer run
    # watches the same PR for the same outcome. Never add this job to the
    # required-check list - a superseded run is cancelled by design.
    concurrency:
      group: deploy-on-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # No checkout, no `uses:`, no secret, and deliberately NOT contents:
    # write - this job only observes the PR and pushes a button. Pinned by
    # bot/tests/security/test_workflow_split.py.
    permissions:
      actions: write # gh workflow run render-deploy.yml (workflow_dispatch)
      pull-requests: read # gh pr view
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      # Issue #67. `arm-auto-merge` hands the merge to GitHub, which performs
      # it with GITHUB_TOKEN - and a push made with GITHUB_TOKEN starts no
      # workflow run, so `render-deploy`'s `push` trigger never fires for the
      # machine lane and index.ocx.sh silently stops advancing. `*/15` is the
      # standing mitigation and delivers ~hourly in practice (#67's measured
      # gap series: worst 222 min).
      #
      # `workflow_dispatch` IS a documented exception to that recursion guard,
      # so a bot-fired dispatch does start a run. The thing that was missing
      # was a bot process still alive after the merge to fire it - this job is
      # that process. It holds no write on the base branch and cannot merge
      # anything; it watches the merge `arm-auto-merge` already armed and,
      # the moment GitHub lands it, dispatches the deploy. Race window is one
      # poll interval (15 s), not one cron gap.
      #
      # Failure is a soft landing by construction: arming is what merges the
      # PR, and that has already happened by the time this job runs, so a
      # cancelled/timed-out/failed poll costs the fast path only - the
      # schedule still deploys, exactly as it does today. That is why the
      # timeout warns instead of failing: red here would mean "the PR sat
      # waiting for a required check", which is normal, and would train the
      # lane's only red X to be ignored.
      # Every API call below is fail-OPEN, the deliberate opposite of
      # `arm-auto-merge`'s unguarded reads. That job runs BEFORE the merge and
      # must go red rather than leave a stale arm standing; this one runs
      # after, so `set -e` on a single 502 or secondary rate-limit — in up to
      # 100 polls plus a dispatch — would paint an already-merged PR red,
      # which is precisely the never-red-on-a-merged-PR property argued
      # above, and far likelier than the timeout that path already softened
      # to a warning. Nothing in this step may exit non-zero.
      - name: Dispatch render-deploy once the merge lands
        run: |
          set -euo pipefail
          api_failures=0
          for _ in $(seq 1 100); do
            # A failed read leaves `state` empty, matches no case below, and
            # polls again; only the count survives, for the warning's sake.
            state="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq .state)" || api_failures=$((api_failures + 1))
            case "$state" in
              MERGED)
                # --ref main, not the merge commit: `workflow_dispatch` only
                # accepts a ref, and main can only have moved FORWARD past our
                # merge, so the tree deployed always contains it.
                if gh workflow run render-deploy.yml --repo "$REPO" --ref main; then
                  echo "::notice title=deploy::PR #$PR_NUMBER merged - render-deploy dispatched for main."
                else
                  echo "::warning title=deploy::PR #$PR_NUMBER merged but the render-deploy dispatch was rejected; render-deploy falls back to its schedule - see #67 for what that actually delivers."
                fi
                exit 0
                ;;
              CLOSED)
                echo "::notice title=deploy::PR #$PR_NUMBER was closed without merging - nothing to deploy."
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "::warning title=deploy::PR #$PR_NUMBER did not merge within 25 min ($api_failures of 100 polls could not reach the API; required checks still pending?). Auto-merge stays armed and will land it; render-deploy falls back to its schedule - see #67 for what that actually delivers."
