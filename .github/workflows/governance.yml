# generated by indexbot ci v1 — do not edit
name: governance

# The privileged half of ADR-4 (adr_index_bot_and_workflow_security.md) BD-5's
# privileged/unprivileged split, extended by ADR-6 (adr_fork_pr_announce.md)
# for the fork-PR announce lane. The unprivileged half — `schema-validate-pr`,
# the required check that reads THIS PR's own `p/**` diff — lives in
# `validate.yml` on the `pull_request` trigger.
#
# The split is one-workflow-per-trigger, and that is a security property, not
# tidiness. Both halves used to live in one workflow that declared BOTH
# `pull_request` and `pull_request_target`, with a job-level
# `if: github.event_name == ...` picking which half ran. A job skipped by such
# an `if:` still emits a check run — with conclusion `skipped` — under its own
# name, so every `pull_request_target` run published a SKIPPED check run named
# `schema-validate-pr`, the exact context branch protection requires on `main`.
# GitHub treats `skipped` as satisfying a required check and resolves
# duplicate-named contexts to the most recent one, so re-running the
# `pull_request_target` half after a red validation turned the required
# context green without validating anything (and for a first-time fork
# contributor, whose `pull_request` run is held in `action_required` and
# materialises NO job-level check runs at all, the skipped one was the only
# bearer of the context). Two trigger-disjoint workflows make the collision
# structurally impossible: nothing here is named `schema-validate-pr`, and no
# job in either file is skipped for trigger reasons.
# Pinned by the index deployment's own workflow-split tests.
#
#   governance-gate (GITHUB_TOKEN only, NEVER checks out PR head):
#     `indexbot governance-gate --no-arm`. Classifies the diff via the GitHub
#     API only, labels the PR, sets the "governance/review-required" commit
#     status (G-19 owners-membership + G-20 reviewer assignment), and
#     publishes its own `disposition` as a job output. `--no-arm` is what
#     keeps it at `contents: read`.
#   arm-auto-merge: the only job that holds `contents: write`, because arming
#     or withdrawing auto-merge is a deferred write to the base branch. Same
#     command, `--arm-only`: it classifies nothing and writes no label and no
#     status, it only replays the disposition governance-gate already
#     published — never the raw classify-pr label, which cannot see the G-19
#     ownership result. GitHub itself merges once branch protection's required
#     checks are green; when they are ALREADY green the forge refuses to arm
#     (CLEAN/UNSTABLE are already-mergeable states) and the adapter performs
#     the identical squash itself, pinned to the gated head, never `--admin`,
#     so branch protection binds either way.
#   deploy-on-merge (rendered only when `ci.deploy_workflow` names one;
#     checkout-free, `actions: write` and nothing else): the
#     machine lane's deploy trigger. GitHub performs the armed merge with
#     GITHUB_TOKEN, whose push starts no workflow run, so `render-deploy`'s
#     `push` trigger never fires for this lane (ocx-sh/index#67). This job stays alive
#     across the merge and fires the one trigger that IS exempt from that
#     recursion guard — `workflow_dispatch`. It can merge nothing and write
#     nothing; losing it costs the fast path only.
#
# ## Why arm-auto-merge is still its own job
#
# It used to be a job with no dependencies at all: no checkout, no `uses:`,
# nothing but `gh` calls, and that dependency-free-ness WAS the argument — a
# job that can move the base branch executes nothing, so there is no code
# there for a supply-chain compromise to inhabit. Running `indexbot` gives
# that up, and the trade is stated rather than softened:
#
#   Given up: the job holding `contents: write` now checks out the base ref
#   and runs this bot and its whole dependency tree. A compromise of either
#   reaches a token that can move an unprotected branch and merge a pull
#   request.
#
#   Bought: arming and withdrawing are tested Python instead of untested
#   shell — head-SHA binding, an idempotent withdraw that does not error on a
#   PR that was never armed, and the already-mergeable fallback, each with a
#   named test — and one CI job is one `indexbot` command, so a hand-written
#   pipeline reimplements none of it.
#
#   Why it is acceptable: the code is version-pinned and hash-locked by the
#   deployment's own lockfile and is ALREADY running one job over, in
#   `governance-gate`, which holds `pull-requests`/`issues`/`statuses: write`
#   — and, in the render lane, with the credential that publishes the served
#   index clients actually read. Withholding `contents: write` from that same
#   code here never closed the path it looked like it closed.
#
# So the two-job split does NOT survive as permission scoping — both jobs run
# the same pinned code, and a bot that could lie about `disposition` could arm
# on its own lie either way. It survives because of `if: ${{ !cancelled() }}`
# below: a gate that ERRORS still reaches the withdraw, and publishes an empty
# disposition that can only take the withdraw branch. One job cannot do that —
# a process that dies mid-gate leaves an earlier arming standing on a stale
# evaluation. Fail-closed withdrawal is the property, and it is why merging
# these two back into one is a regression even though the permissions would
# look tidier.
#
# "governance/review-required" is deliberately NOT a required check and must
# not become one: governance-check reports it `pending` for every human-lane
# PR and nothing re-runs it green after approval, so requiring it would
# deadlock the human lane permanently. No job in this file may be added to
# the required-check list either: `arm-auto-merge`'s superseded pending runs
# and `deploy-on-merge`'s superseded polls are cancelled by design — and
# `deploy-on-merge` waits ON the required checks, so requiring it would
# deadlock the machine lane against itself.
#
# One consequence of that design, accepted rather than scoped away: a
# cancelled JOB sets the whole RUN's conclusion. A superseded `deploy-on-merge`
# poll therefore makes an otherwise clean governance run conclude `cancelled`
# (live: run 30246486520 — governance-gate success, arm-auto-merge success,
# deploy-on-merge cancelled → run `cancelled`; before this job existed the
# same run would have read `success`). Both escapes are worse than the flip:
# dropping `cancel-in-progress` stacks a second 25-minute poll behind the
# first and dispatches the deploy twice, and moving the job into its own
# workflow duplicates the privileged `pull_request_target` gate it reads
# `disposition` from. The flip is also the honest signal — that run really
# did not finish every job it started.
#
# So the RUN-level conclusion of this workflow carries no governance meaning
# and must not be audited or alerted on. Read the per-job conclusions instead
# (`gh run view <id> --json jobs`): `governance-gate` and `arm-auto-merge` are
# the ones that mean something, and a `cancelled` on either is the pending-job
# supersession described one paragraph up, never a withdrawal that was skipped.

on:
  # zizmor: ignore[dangerous-triggers] ADR-4 BD-5's deliberate privileged
  # split: no job here ever checks out PR-head content (default base-ref
  # checkout, and `ref:` appears nowhere in this file — WF-05), none runs
  # PR-controlled code, and the diff is only ever read through the GitHub API
  # — the exact posture this audit otherwise warns is usually missing.
  pull_request_target:

permissions: {}

jobs:
  governance-gate:
    name: governance-gate
    runs-on: ubuntu-latest
    # Serialize per-PR: BD-5 Risk 1 flags label/status races between
    # concurrent classification runs (e.g. two rapid pushes) as untested
    # territory. Queuing (not cancelling) avoids a run being cut off between
    # its label-apply and status-set steps.
    concurrency:
      group: governance-gate-${{ github.event.pull_request.number }}
    outputs:
      disposition: ${{ steps.gate.outputs.disposition }}
    permissions:
      contents: read # checkout base ref only; runs the pinned indexbot, never PR-head code
      pull-requests: write # classify-pr's add_labels + G-20 reviewer assignment
      statuses: write # governance-check's set_commit_status (governance/review-required); a separate scope from pull-requests
      issues: write # governance-check's create_comment (G-20) posts via the Issues API even for a PR — pull-requests: write alone 403s it
    steps:
      # pull_request_target's default checkout ref is the BASE branch tip —
      # deliberately left unset (never github.event.pull_request.head.sha).
      # This job only ever runs base-branch code against an API-derived diff.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-indexbot

      # One command for what used to be two steps wiring two subcommands
      # together (`classify-pr`, then `governance-check`) and reading one's
      # output into the other's `if:`. `--no-arm` is the whole reason this job
      # can stay at `contents: read`: it stops short of the auto-merge write
      # and hands `arm-auto-merge` the disposition instead.
      #
      # `--pr` goes through an env var, not `run:` interpolation (ADR-4 BD-4).
      # The PR number is runner-supplied and integer-shaped, so this is
      # discipline rather than a live hazard — but the discipline is what
      # survives someone later adding a field that is neither.
      - name: indexbot governance-gate
        id: gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen --project bot-tools -- indexbot governance-gate --pr "$PR_NUMBER" --no-arm

  arm-auto-merge:
    name: arm-auto-merge
    needs: governance-gate
    # Withdrawal is fail-closed, so this job must not inherit the default
    # `success()` a `needs:` implies: a governance-gate that *errors* (API 5xx,
    # a malformed base-ref root, a `uv` resolution failure) would skip this job
    # and leave an already-armed PR armed on a stale evaluation. `!cancelled()`
    # keeps it reachable; a failed gate publishes an empty `disposition`, which
    # `--arm-only` reads as "not success" and turns into a withdraw, and which
    # can never be read as an arm. This is the property the two-job split
    # exists for (file header) — do not weaken this `if:`. No
    # `github.event_name` half is needed (or wanted) here: this workflow has
    # exactly one trigger, and a trigger-discriminating `if:` is precisely the
    # skipped-check-run hazard the header describes.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Serialize per PR, so a stale arm can never land after a fresh withdraw:
    # arm jobs become eligible in gate-completion order, and a queue without
    # cancel-in-progress preserves that order. Deliberately its OWN group and
    # not governance-gate's: GitHub cancels "any previously pending job or
    # workflow in the concurrency group" when a new one queues, so sharing the
    # gate's group would let a newly eligible arm job cancel a still-pending
    # gate for a newer head — reintroducing the very stale arm this
    # serialization exists to prevent. Never add this job to the required-check
    # list: a superseded pending run is cancelled by design.
    concurrency:
      group: arm-auto-merge-${{ github.event.pull_request.number }}
    permissions:
      # Enabling or withdrawing auto-merge IS a deferred write to the base
      # branch — and when GitHub reports the PR already mergeable, the adapter
      # performs the squash merge itself — GitHub documents the REST sibling
      # (PUT /repos/{owner}/{repo}/pulls/{n}/merge) as needing Contents:
      # write. Granting it here rather than widening governance-gate is what
      # the file header's fail-closed-withdrawal argument rests on.
      contents: write
      pull-requests: write
    steps:
      # Base ref only, same as governance-gate: `ref:` appears nowhere in this
      # file, so no job here can check out PR-head content (WF-05).
      # `persist-credentials: false` matters more in THIS job than anywhere
      # else in the tree — the default would write a `contents: write` token
      # into `.git/config`, where every later step inherits it through plain
      # `git`, dependency resolution included. Pinned by WF-06.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-indexbot

      # G-19: arm on governance-check's own `disposition` — the
      # ownership-checked machine-lane result (refresh classification AND the
      # PR author owns every touched root), not the raw classify-pr label,
      # which cannot see the G-19 outcome. Anything other than `success`,
      # the empty string a failed gate publishes included, withdraws instead.
      #
      # HEAD_SHA is the head THIS EVENT delivered, and binding to it is the
      # arm's optimistic-concurrency guard. If the author pushed between the
      # event and the gate, the forge answers "head moved" and nothing is
      # armed — the `synchronize` event for the new head re-gates it. Stale
      # decisions expire; they never arm.
      #
      # Both values go through env vars rather than `run:` interpolation
      # (ADR-4 BD-4): `disposition` is bot-authored from a closed set and
      # `head.sha` is runner-supplied, so neither is untrusted today, and the
      # indirection is what keeps that true after the next edit.
      - name: indexbot governance-gate --arm-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPOSITION: ${{ needs.governance-gate.outputs.disposition }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # One line on purpose, long as it is: `run: >-` would fold it across
        # three, and "this job runs one command" stops being readable off the
        # page the moment it takes a YAML scalar style to see it.
        run: uv run --frozen --project bot-tools -- indexbot governance-gate --pr "$PR_NUMBER" --arm-only --disposition "$DISPOSITION" --head-sha "$HEAD_SHA"

  deploy-on-merge:
    name: deploy-on-merge
    needs: [governance-gate, arm-auto-merge]
    if: needs.governance-gate.outputs.disposition == 'success'
    runs-on: ubuntu-latest
    # The whole point is to outlive the merge, so the ceiling is generous;
    # the loop below stops itself at 25 min so its own warning gets printed
    # instead of being cut off by this.
    timeout-minutes: 30
    # NOT arm-auto-merge's group, and cancel-in-progress on purpose. Sharing
    # the arm group would park a fresh withdrawal behind this job's 25-minute
    # wait, which is exactly the stale-arm window that serialization exists to
    # prevent. A `synchronize` supersedes the poll instead: the newer run
    # watches the same PR for the same outcome. Never add this job to the
    # required-check list - a superseded run is cancelled by design.
    concurrency:
      group: deploy-on-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # The one job in this generator that is still shell rather than a single
    # `indexbot` command, deliberately. It is not governance: it holds no
    # opinion about the pull request, it waits for a merge someone else armed
    # and presses `workflow_dispatch` - a trigger with no GitLab counterpart,
    # on a workflow whose name is the deployment's own hosting choice. Folding
    # it into the bot would put a 25-minute forge-specific poll loop behind a
    # command surface that has to mean the same thing on both forges, to buy
    # tests for a path whose entire failure mode is "the schedule deploys
    # instead". If a second forge ever needs it, that is the moment it becomes
    # a command.
    #
    # No checkout, no `uses:`, no secret, and deliberately NOT contents:
    # write - this job only observes the PR and pushes a button. Pinned by
    # the index deployment's own workflow-split tests.
    permissions:
      actions: write # gh workflow run render-deploy.yml (workflow_dispatch)
      pull-requests: read # gh pr view
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      # Issue ocx-sh/index#67. `arm-auto-merge` hands the merge to GitHub, which performs
      # it with GITHUB_TOKEN - and a push made with GITHUB_TOKEN starts no
      # workflow run, so `render-deploy.yml`'s `push` trigger never fires for the
      # machine lane and the published index silently stops advancing. `*/15` is the
      # standing mitigation and delivers ~hourly in practice (ocx-sh/index#67's measured
      # gap series: worst 222 min).
      #
      # `workflow_dispatch` IS a documented exception to that recursion guard,
      # so a bot-fired dispatch does start a run. The thing that was missing
      # was a bot process still alive after the merge to fire it - this job is
      # that process. It holds no write on the base branch and cannot merge
      # anything; it watches the merge `arm-auto-merge` already armed and,
      # the moment GitHub lands it, dispatches the deploy. Race window is one
      # poll interval (15 s), not one cron gap.
      #
      # Failure is a soft landing by construction: arming is what merges the
      # PR, and that has already happened by the time this job runs, so a
      # cancelled/timed-out/failed poll costs the fast path only - the
      # schedule still deploys, exactly as it does today. That is why the
      # timeout warns instead of failing: red here would mean "the PR sat
      # waiting for a required check", which is normal, and would train the
      # lane's only red X to be ignored.
      # Every API call below is fail-OPEN, the deliberate opposite of
      # `arm-auto-merge`, which lets every forge error surface. That job runs
      # BEFORE the merge and must go red rather than leave a stale arm
      # standing (its one swallowed case is a moved head, which is a stale
      # decision rather than a failure); this one runs
      # after, so `set -e` on a single 502 or secondary rate-limit — in up to
      # 100 polls plus a dispatch — would paint an already-merged PR red,
      # which is precisely the never-red-on-a-merged-PR property argued
      # above, and far likelier than the timeout that path already softened
      # to a warning. Nothing in this step may exit non-zero.
      - name: Dispatch the deploy workflow once the merge lands
        run: |
          set -euo pipefail
          api_failures=0
          for _ in $(seq 1 100); do
            # A failed read leaves `state` empty, matches no case below, and
            # polls again; only the count survives, for the warning's sake.
            state="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq .state)" || api_failures=$((api_failures + 1))
            case "$state" in
              MERGED)
                # --ref main, not the merge commit: `workflow_dispatch` only
                # accepts a ref, and main can only have moved FORWARD past our
                # merge, so the tree deployed always contains it.
                if gh workflow run "render-deploy.yml" --repo "$REPO" --ref main; then
                  echo "::notice title=deploy::PR #$PR_NUMBER merged - render-deploy.yml dispatched for main."
                else
                  echo "::warning title=deploy::PR #$PR_NUMBER merged but the deploy dispatch was rejected; the deploy workflow falls back to whatever schedule it carries - see ocx-sh/index#67 for what that actually delivers."
                fi
                exit 0
                ;;
              CLOSED)
                echo "::notice title=deploy::PR #$PR_NUMBER was closed without merging - nothing to deploy."
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "::warning title=deploy::PR #$PR_NUMBER did not merge within 25 min ($api_failures of 100 polls could not reach the API; required checks still pending?). Auto-merge stays armed and will land it; the deploy workflow falls back to whatever schedule it carries - see ocx-sh/index#67 for what that actually delivers."
