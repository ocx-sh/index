<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="dprint">
  <title>dprint</title>
  <rect width="512" height="512" rx="104" fill="#232a3b"/>
  <!-- The indent guide: what a formatter aligns everything to. -->
  <rect x="166" y="128" width="8" height="256" rx="4" fill="#3ec6a4" opacity="0.55"/>
  <!-- Formatted lines — flush left at the margin, nested lines flush to the guide. -->
  <g fill="#e6ebf5">
    <rect x="112" y="140" width="196" height="26" rx="13"/>
    <rect x="190" y="200" width="168" height="26" rx="13"/>
    <rect x="190" y="260" width="122" height="26" rx="13" fill="#3ec6a4"/>
    <rect x="190" y="320" width="196" height="26" rx="13"/>
    <rect x="112" y="380" width="86" height="26" rx="13"/>
  </g>
</svg>
