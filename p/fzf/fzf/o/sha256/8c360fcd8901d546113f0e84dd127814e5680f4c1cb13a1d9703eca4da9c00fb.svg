<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Original minimal geometric mark authored for this OCX mirror.
  Upstream fzf publishes only raster marks (junegunn/i: fzf-color.png,
  fzf-mono.png), so no upstream SVG was adopted. Motif: a terminal prompt
  chevron beside a candidate list narrowing from many rows to one highlighted
  match — what a fuzzy finder does.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" version="1.1">
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="#1d2430"/>
  <path d="M 112 168 L 176 216 L 112 264"
        fill="none" stroke="#7ee787" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="224" y="199" width="176" height="34" rx="17" ry="17" fill="#7ee787"/>
  <rect x="112" y="308" width="288" height="26" rx="13" ry="13" fill="#4a5568"/>
  <rect x="112" y="366" width="196" height="26" rx="13" ry="13" fill="#39414f"/>
</svg>
