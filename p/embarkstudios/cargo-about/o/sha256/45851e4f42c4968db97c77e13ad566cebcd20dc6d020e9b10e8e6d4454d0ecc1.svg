<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="cargo-about">
  <title>cargo-about</title>
  <!-- Original mark authored for this OCX mirror. Upstream ships no logo file;
       its README heading uses the emoji 📜, echoed here as a scroll of license
       lines. Embark's badge violet (#8A2BE2) is the only borrowed element. -->
  <rect width="512" height="512" rx="96" fill="#1B1B22"/>
  <!-- scroll: a page with a rolled top and bottom edge -->
  <g fill="none" stroke="#8A2BE2" stroke-width="22" stroke-linejoin="round" stroke-linecap="round">
    <path d="M148 128 h216 a32 32 0 0 1 0 64 h-216 a32 32 0 0 1 0 -64 Z"/>
    <path d="M148 384 h216 a32 32 0 0 0 0 -64 h-216 a32 32 0 0 0 0 64 Z"/>
    <path d="M148 192 v128"/>
    <path d="M364 192 v128"/>
  </g>
  <!-- license lines on the page -->
  <g stroke="#9BE38F" stroke-width="20" stroke-linecap="round">
    <path d="M200 240 h176"/>
    <path d="M200 288 h112"/>
  </g>
</svg>
