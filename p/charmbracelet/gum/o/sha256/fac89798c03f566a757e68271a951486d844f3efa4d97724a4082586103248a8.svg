<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="gum">
  <title>gum</title>
  <!-- Original mark authored for this mirror repository; see ../NOTICE.md.
       A pack of gum with foil sticks sliding out, in Charm's palette. -->
  <g transform="rotate(-24 256 256)">
    <!-- foil sticks, drawn first so the pack overlaps their top edge -->
    <rect x="196" y="330" width="128" height="118" rx="16" fill="#B9BCD6"/>
    <rect x="178" y="330" width="128" height="134" rx="16" fill="#DCDEEE"/>
    <rect x="160" y="330" width="128" height="150" rx="16" fill="#F2F3FA"/>
    <!-- the pack -->
    <rect x="146" y="72" width="196" height="286" rx="30" fill="#7D56F4"/>
    <!-- label band -->
    <rect x="146" y="176" width="196" height="88" fill="#F780E2"/>
    <rect x="146" y="176" width="196" height="9" fill="#FFFFFF" opacity="0.4"/>
    <!-- open flap edge -->
    <rect x="146" y="340" width="196" height="18" rx="8" fill="#6842E0"/>
  </g>
  <!-- bubbles -->
  <circle cx="416" cy="104" r="40" fill="#F780E2"/>
  <circle cx="468" cy="178" r="19" fill="#F780E2" opacity="0.75"/>
  <circle cx="80" cy="392" r="30" fill="#A0F77E"/>
</svg>
