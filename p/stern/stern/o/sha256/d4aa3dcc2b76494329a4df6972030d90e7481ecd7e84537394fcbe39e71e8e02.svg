<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="stern">
  <title>stern</title>
  <!--
    Original mark authored for the OCX mirror — stern ships no logo of its own.
    Four stacked log lines, each led by a colour block: stern's defining
    behaviour is tailing many pods at once and colour-coding each one so the
    interleaved stream stays readable. The palette is the terminal's own
    (red / green / yellow / blue), which is what stern actually paints with.
  -->
  <rect width="512" height="512" rx="104" fill="#1e2430"/>

  <g>
    <rect x="80"  y="116" width="88"  height="40" rx="20" fill="#ef4444"/>
    <rect x="188" y="116" width="244" height="40" rx="20" fill="#8b93a7" opacity="0.85"/>

    <rect x="80"  y="196" width="88"  height="40" rx="20" fill="#22c55e"/>
    <rect x="188" y="196" width="188" height="40" rx="20" fill="#8b93a7" opacity="0.7"/>

    <rect x="80"  y="276" width="88"  height="40" rx="20" fill="#eab308"/>
    <rect x="188" y="276" width="216" height="40" rx="20" fill="#8b93a7" opacity="0.85"/>

    <rect x="80"  y="356" width="88"  height="40" rx="20" fill="#3b82f6"/>
    <rect x="188" y="356" width="160" height="40" rx="20" fill="#8b93a7" opacity="0.55"/>
  </g>
</svg>
