<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="dust">
  <title>dust</title>
  <!-- Original mark authored for this OCX mirror. Upstream bootandy/dust ships
       no logo (media/ holds only a terminal screenshot), so nothing here is
       derived from an upstream trademark. The motif is dust's own output: a
       tree spine on the left, bars descending by size to the right. -->
  <defs>
    <linearGradient id="dust-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3a4e"/>
      <stop offset="1" stop-color="#22212e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#dust-bg)"/>
  <!-- tree spine + branch stubs -->
  <g fill="none" stroke="#6f6b8a" stroke-width="16" stroke-linecap="round">
    <path d="M112 136 V376"/>
    <path d="M112 136 H150"/>
    <path d="M112 232 H150"/>
    <path d="M112 328 H150"/>
    <path d="M112 376 H150"/>
  </g>
  <!-- bars, descending by size -->
  <g rx="18">
    <rect x="170" y="112" width="242" height="48" rx="24" fill="#f2b544"/>
    <rect x="170" y="208" width="176" height="48" rx="24" fill="#e08b3c"/>
    <rect x="170" y="304" width="110" height="48" rx="24" fill="#c96a5a"/>
    <rect x="170" y="352" width="62" height="48" rx="24" fill="#8f6f9e"/>
  </g>
</svg>
