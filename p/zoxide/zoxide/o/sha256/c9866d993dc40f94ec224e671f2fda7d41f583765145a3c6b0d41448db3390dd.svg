<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Original mark authored for the OCX mirror of zoxide.
  Upstream ships no logo of its own (the only images in ajeetdsouza/zoxide's
  README are third-party sponsor marks, which are not reusable here), so this
  is an original minimal geometric device: a bold "z" cut as a single polygon
  — the jump between two directories that zoxide's `z` command performs.
  No upstream trademark is reproduced.
-->
<svg
   width="180"
   height="180"
   viewBox="0 0 180 180"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"><g
     id="layer1"><circle
       style="fill:#111827;fill-opacity:1"
       id="field"
       cx="90"
       cy="90"
       r="84" /><polygon
       style="fill:#ffffff;fill-opacity:1"
       id="zmark"
       points="48,52 132,52 132,72 80,108 132,108 132,128 48,128 48,108 100,72 48,72" /></g></svg>
