<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="lsd">
  <title>lsd</title>
  <!--
    Original mark authored for the OCX catalog. Upstream lsd-rs/lsd publishes no
    official logo (doc/img holds only palette swatches), so this is not a
    reproduction of any third-party mark.

    A three-entry colorized listing: one colored file-type tile plus one neutral
    name bar per row. The tile colors are lsd's own default palette — 0087ff
    (directory), 00d700 (executable), d78700 — taken from upstream doc/img.
  -->
  <g>
    <rect x="64" y="72" width="96" height="96" rx="22" fill="#0087ff"/>
    <rect x="200" y="100" width="248" height="40" rx="20" fill="#9aa0a6"/>
  </g>
  <g>
    <rect x="64" y="208" width="96" height="96" rx="22" fill="#00d700"/>
    <rect x="200" y="236" width="200" height="40" rx="20" fill="#9aa0a6"/>
  </g>
  <g>
    <rect x="64" y="344" width="96" height="96" rx="22" fill="#d78700"/>
    <rect x="200" y="372" width="224" height="40" rx="20" fill="#9aa0a6"/>
  </g>
</svg>
