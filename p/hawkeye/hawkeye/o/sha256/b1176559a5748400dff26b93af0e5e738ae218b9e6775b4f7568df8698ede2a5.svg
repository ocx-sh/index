<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HawkEye logo">
  <title>HawkEye</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2933"/>
      <stop offset="1" stop-color="#3e4c59"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.75" stop-color="#f4a000"/>
      <stop offset="1" stop-color="#c97a00"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Hawk-eye almond outline -->
  <path d="M64 256 C160 144 352 144 448 256 C352 368 160 368 64 256 Z"
        fill="#0f1419" stroke="#e4e7eb" stroke-width="16" stroke-linejoin="round"/>
  <!-- Iris -->
  <circle cx="256" cy="256" r="88" fill="url(#iris)"/>
  <!-- Pupil -->
  <circle cx="256" cy="256" r="44" fill="#0f1419"/>
  <!-- Catchlight -->
  <circle cx="232" cy="232" r="16" fill="#ffffff" opacity="0.9"/>
  <!-- Brow stroke suggesting a hawk -->
  <path d="M96 196 C176 150 336 150 416 196"
        fill="none" stroke="#9aa5b1" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
</svg>
