<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>hyperfine</title>
  <g stroke="#14b8a6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- stopwatch body -->
    <circle cx="296" cy="300" r="150" fill="#0f766e" fill-opacity="0.12"/>
    <!-- top stem + crown button -->
    <path d="M296 150 V112"/>
    <path d="M262 100 H330" stroke-width="26"/>
    <!-- side start/stop button -->
