    <circle cx="296" cy="300" r="14" fill="#14b8a6" stroke="none"/>
    <!-- speed / motion lines (fast) -->
    <path d="M120 252 H40" stroke="#2dd4bf"/>
    <path d="M132 312 H64" stroke="#2dd4bf"/>
    <path d="M120 372 H40" stroke="#2dd4bf"/>
  </g>
