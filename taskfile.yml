# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Repo gate contract. `verify` == the CI job set across BOTH workflows:
# .github/workflows/ci.yml (schema-validate, bot-test, bot-workflows,
# verify-indexbot-ci, bot-audit, workflows-lint, render-check;
# golden-baseline is CI-only — see `verify`)
# and .github/workflows/catalog-ci.yml (build, verify-catalog-ci), which is
# RENDERED by `ocx-catalog ci` from catalog.config.json's `ci` block and must
# never be hand-edited. No drift between this file and either workflow — see
# .claude/state/plans/plan_index_v1.md WP1-C/WP3-A and
# .claude/artifacts/adr_index_bot_and_workflow_security.md.

version: '3'

# Gitignored per-machine defaults for the renderer switch, e.g.
# `echo CATALOG_DEV=1 > .env.local`. CLI vars still win.
dotenv: ['.env.local']

includes:
  bot:
    taskfile: ./bot-tools/taskfile.yml
    dir: ./bot-tools

vars:
  RENDER_OUT: site/.vitepress/dist
  RENDER_INDEX_DIR: ""
  # Renderer switch: released npm package (default -- CI/deploys, always)
  # or the sibling checkout via CATALOG_DEV=1 (task CLI or .env.local; the
  # self-default pattern lets the env value through, a plain literal would
  # shadow it). package.json/bun.lock stay untouched. Set it on the task
  # CLI, never via nested `task:` vars -- those don't propagate (see
  # render:build's RENDER_INDEX_DIR note).
  CATALOG_PKG_DIR: '{{.CATALOG_PKG_DIR | default "../ocx-catalog"}}'
  CATALOG_DEV: '{{.CATALOG_DEV | default ""}}'
  CATALOG_BIN: '{{if .CATALOG_DEV}}node {{.CATALOG_PKG_DIR}}/dist/cli/index.js{{else}}./node_modules/.bin/ocx-catalog{{end}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  schema:validate:
    desc: >-
      check-jsonschema metaschema check on schema/*.schema.json; every
      fixture in schema/fixtures/valid/ must pass, every fixture in
      schema/fixtures/invalid/ must FAIL validation (fixture name prefix up
      to -valid-/-invalid- selects the schema file) AND must fail for the
      reason recorded against it in schema/fixtures/invalid/expected-reasons.txt.
      Asserting only "it failed" is not enough: a fixture written to prove the
      D7 reserved-tag rule but rejected by, say, the tag-length bound would
      pass a failure-only gate while certifying nothing about the rule. Every
      fixture must have an entry in that file; a missing one is an error. The
      converse too: an entry naming a fixture that no longer exists is an
      error, so a deleted or renamed fixture cannot leave a rotting row behind
      and quietly turn the reason file into decoration.
    set: [e, u, pipefail]
    cmds:
      - |
        reasons=schema/fixtures/invalid/expected-reasons.txt

        echo "== metaschema: schema/*.schema.json =="
        uvx check-jsonschema --check-metaschema schema/*.schema.json

        echo "== valid fixtures (must pass) =="
        for f in schema/fixtures/valid/*.json; do
          base=$(basename "$f")
          schema="schema/${base%%-valid-*}.schema.json"
          if [ ! -f "$schema" ]; then
            echo "no schema found for fixture $f (derived: $schema)" >&2
            exit 1
          fi
          echo "-- $f vs $schema"
          uvx check-jsonschema --schemafile "$schema" "$f"
        done

        echo "== invalid fixtures (must FAIL validation, for the recorded reason) =="
        for f in schema/fixtures/invalid/*.json; do
          base=$(basename "$f")
          schema="schema/${base%%-invalid-*}.schema.json"
          if [ ! -f "$schema" ]; then
            echo "no schema found for fixture $f (derived: $schema)" >&2
            exit 1
          fi
          want=$(grep -F "$base|" "$reasons" | head -1 | cut -d'|' -f2- || true)
          if [ -z "$want" ]; then
            echo "no expected reason recorded for $f in $reasons" >&2
            exit 1
          fi
          echo "-- $f vs $schema (expect failure: $want)"
          if out=$(uvx check-jsonschema --schemafile "$schema" "$f" 2>&1); then
            echo "FIXTURE SHOULD HAVE FAILED VALIDATION BUT PASSED: $f" >&2
            exit 1
          fi
          case "$out" in
            *"$want"*) ;;
            *)
              echo "FIXTURE FAILED FOR THE WRONG REASON: $f" >&2
              echo "  expected substring: $want" >&2
              echo "  actual output:" >&2
              echo "$out" >&2
              exit 1
              ;;
          esac
        done

        echo "== recorded reasons must name an existing fixture =="
        for base in $(grep -v '^#' "$reasons" | cut -d'|' -f1); do
          if [ ! -f "schema/fixtures/invalid/$base" ]; then
            echo "stale entry in $reasons: no fixture named $base" >&2
            exit 1
          fi
        done

        echo "schema:validate: OK"

  workflows:lint:
    desc: >-
      zizmor security lint (exactly ci.yml's workflows-lint job) across the
      whole workflows/actions tree — deploy.yml (the last unpinned-actions
      holdout) retired by Phase 3's render-deploy.yml, so the scope is the
      full .github/ directory, not a file allowlist.
    cmds:
      - uvx zizmor --min-severity medium .github/

  site:build:
    desc: >-
      Catalog site build via the extracted @ocx-sh/catalog package
      (plan_catalog_extraction WP-11 -- the local stand-in for the RENDERED
      catalog-ci.yml `build` job, which runs the bare `ocx-catalog build`
      this task wraps; replaces the retired in-repo VitePress build). Root
      catalog.config.json
      configures one `root: true` source at `.`, the committed `p/**` tree
      -- `ocx-catalog build` resolves it, synthesizes routes, renders the
      VitePress site, and mirrors every wire file it found under that
      source verbatim into the output tree. `config.json`/`c/index.json`
      are OPTIONAL per source and absent from the raw committed tree (they
      are bot-rendered artifacts, never committed) -- `render:build`'s
      second step, `indexbot render --out`, adds them into this same
      output tree afterward, same two-step order as before this package
      existed (see that task's own doc). RENDER_INDEX_DIR (default "")
      swaps the configured source's `path` from `.` to `demo` via a
      generated, gitignored `.catalog.config.render.json` -- the dynamic-
      route loader this used to drive (site/src/[ns]/[pkg].paths.ts) is
      retired along with the rest of the old theme, so this is the new
      demo/real switch (see demo:* tasks, site/README.md).
    cmds:
      - bun install --frozen-lockfile
      - >-
        jq --arg path '{{if .RENDER_INDEX_DIR}}{{.RENDER_INDEX_DIR}}{{else}}.{{end}}'
        '.sources[0].path = $path' catalog.config.json
        > .catalog.config.render.json
      - '{{.CATALOG_BIN}} build --config .catalog.config.render.json --out {{.RENDER_OUT}}'

  render:build:
    desc: >-
      Full render pipeline against the committed p/ source tree, sandwiching
      the catalog-package build per the fixed build order (ADR
      adr_catalog_docs_colocation.md "Build pipeline order", plan Phase 3
      WP3-A, reshaped by plan_site_redesign WP-bot/WP-ci, then by
      plan_catalog_extraction WP-11): (1) `site:build` (`ocx-catalog build`)
      resolves the configured source(s) — the committed `p/*/*.json` tree
      (or `demo/p/*/*.json` when RENDER_INDEX_DIR=demo, see demo:* tasks) —
      synthesizes routes, renders {{.RENDER_OUT}}, and mirrors every wire
      file it found under each source verbatim, but `config.json`/
      `c/index.json` are OPTIONAL per source and absent from the raw
      committed tree (bot-rendered artifacts, never committed), so this
      pass alone does not yet produce them; (2) `indexbot render --out`
      emits config.json + the /p/** wire mirror + /c/index.json directly
      into {{.RENDER_OUT}}, only AFTER step 1 — reversing the two steps
      silently deletes those files on the next deploy (the package's own
      build has no `emptyOutDir` reason to run after it, but the ORDER
      itself is still load-bearing: step 2 is what supplies the two files
      step 1's mirror cannot). `/data/catalog/catalog.json` is no longer
      one of this step's outputs at all — `ocx-catalog build` (step 1)
      renders that view-model itself, from the same wire tree, with no bot
      involvement (plan_catalog_extraction WP-11; CONTRACTS.md §8). With no
      p/ tree yet (pre-seed), step 2 still emits config.json + an empty
      c/index.json (`{"format_version": 1, "packages": {}}`) — no separate
      p/-absent code path needed. RENDER_INDEX_DIR (top-level var, default
      "") overrides indexbot's own `--index-dir` -- a prefix BEFORE the
      literal `p/` component (`cli/render.py`'s `_p_prefix`), not a
      replacement for it, so "demo" (not "demo/p") reads `demo/p/**`.
      demo:serve is the one caller that overrides it, to "demo". Forwards
      its own resolved RENDER_INDEX_DIR to the site:build sub-task call
      explicitly -- Task does NOT propagate a var override through a nested
      `task:` call unless it's passed via that call's own `vars:` block, so
      without this, site:build would always see its unoverridden global
      default ("") and render the real `p/` tree even under `task
      demo:serve`, while step 2 below still rendered demo/p/** correctly,
      since it references {{.RENDER_INDEX_DIR}} directly in its own scope.
    cmds:
      - task: site:build
        vars:
          RENDER_INDEX_DIR: '{{.RENDER_INDEX_DIR}}'
      - uv run --project bot-tools -- indexbot render --index-dir "{{.RENDER_INDEX_DIR}}" --out {{.RENDER_OUT}}

  schema:validate:rendered:
    desc: >-
      check-jsonschema on render:build's output tree ({{.RENDER_OUT}}):
      config.json against schema/config.schema.json; c/index.json against
      schema/c-index.schema.json (same always-rendered top-level shape as
      config.json); every rendered p/<ns>/<pkg>.json root against
      schema/root.schema.json; every rendered
      p/<ns>/<pkg>/o/sha256/<hex>.json CAS object against
      schema/image-index.schema.json. Pre-seed (no p/ roots rendered
      yet) the latter two `find -exec` calls simply match (and invoke) zero
      files — config.json and c/index.json are still validated. `-exec … +` (not a `read -d
      ''` loop) because Task's own script interpreter isn't bash and
      doesn't support the GNU-only `read -d` flag; `find -exec +` is POSIX
      and file-safe with no shell involved in the match/dispatch step. The
      roots glob carries `-mindepth 3 -maxdepth 3` (WP3-C E2E fix): GNU
      `find -path` has no FNM_PATHNAME semantics, so a bare `*` in `-path`
      matches `/` too — `$out/p/*/*.json` alone also matches
      `$out/p/<ns>/<pkg>/o/sha256/<hex>.json` (a CAS image index,
      six path components below `$out`, vs. a root's three) and fed CAS
      objects into the root-schema check, failing every package with any
      CAS object. The depth bound anchors it to exactly `p/<ns>/<pkg>.json`;
      searching from `$out` (never `$out/p` directly) keeps the pre-seed
      zero-match case working, since `$out` always exists.
    set: [e, u, pipefail]
    cmds:
      - |
        out="{{.RENDER_OUT}}"

        echo "== $out/config.json vs schema/config.schema.json =="
        uvx check-jsonschema --schemafile schema/config.schema.json "$out/config.json"

        echo "== $out/c/index.json vs schema/c-index.schema.json =="
        uvx check-jsonschema --schemafile schema/c-index.schema.json "$out/c/index.json"

        echo "== rendered package roots vs schema/root.schema.json =="
        find "$out" -mindepth 3 -maxdepth 3 -path "$out/p/*/*.json" -exec uvx check-jsonschema --schemafile schema/root.schema.json {} +

        echo "== rendered CAS image indices vs schema/image-index.schema.json =="
        find "$out" -path "$out/p/*/*/o/sha256/*.json" -exec uvx check-jsonschema --schemafile schema/image-index.schema.json {} +

        echo "schema:validate:rendered: OK"

  smoke:test:
    desc: >-
      scripts/smoke-test.sh against a live deploy (default
      https://index.ocx.sh) — hits the network and asserts on deployed
      state, NOT part of verify. Pass extra args after `--`, e.g.
      `task smoke:test -- https://index.ocx.sh --allow-empty`.
    cmds:
      - scripts/smoke-test.sh {{.CLI_ARGS}}

  site:dev:
    desc: >-
      HMR dev server via `ocx-catalog dev` (plan_catalog_extraction WP-11)
      — serves LIVE wire data straight from the configured source, no
      pre-rendered snapshot step needed any more: the package's own
      dev/dev-worker mechanism (S-003) replaces the old ocx-dev-wire Vite
      plugin + site:dev's `indexbot render --out dev-wire` pre-pass
      entirely. Demo tree instead of real p/: `task demo:seed` then `task
      site:dev RENDER_INDEX_DIR=demo`. Serves on the package's own default
      port (see `ocx-catalog dev --help`), not site:preview's 4173.
    cmds:
      - bun install --frozen-lockfile
      - >-
        jq --arg path '{{if .RENDER_INDEX_DIR}}{{.RENDER_INDEX_DIR}}{{else}}.{{end}}'
        '.sources[0].path = $path' catalog.config.json
        > .catalog.config.render.json
      - '{{.CATALOG_BIN}} dev --config .catalog.config.render.json'

  site:preview:
    desc: >-
      `vitepress preview` against an already-built {{.RENDER_OUT}} tree
      as-is (no rebuild) — VitePress's own default outDir convention
      (`<root>/.vitepress/dist`) makes `site` the right root arg with no
      `--outDir` override needed. Run `task render:build` (or `task
      site:serve`, which chains both) first. Pre-kills any process already
      bound to the preview port (4173) so re-running after a not-yet-exited
      prior server doesn't fail with EADDRINUSE.
    cmds:
      - lsof -t -i:4173 | xargs -r kill
      - ./node_modules/.bin/vitepress preview site --port 4173

  site:serve:
    desc: >-
      Local design review server: task render:build then bun run preview —
      serves the exact production-shaped dist tree (incl. /p/** wire files,
      /c/index.json, /data/catalog/catalog.json) Cloudflare Pages would
      deploy, from the real committed p/ tree. `p/` is empty pre-seed (see
      CLAUDE.md "Current State"); for a non-empty local catalog use `task
      demo:serve` instead, which renders the gitignored demo/p/ tree
      (scripts/demo-seed.sh) rather than real p/. Ctrl-C to stop.
    cmds:
      - task: render:build
      - task: site:preview

  demo:seed:
    desc: >-
      Populate the gitignored demo/p/ tree (never the real p/) with
      throwaway demo packages via scripts/demo-seed.sh, for `task
      demo:serve` local design review (plan_site_redesign.md "Verification"
      item 3). Sources: the golden render cases under
      scripts/demo-fixtures/render-cases/
      plus scripts/demo-fixtures/ (deprecation, multi-platform, alias-chain/
      variant-tag coverage the golden fixtures don't have, plus a real SVG/
      PNG logo and README so cards and detail pages have something to
      render). Idempotent — re-running over leftover demo/p/ content just
      skips already-seeded packages, no refuse-guard needed since demo/ is
      gitignored (nothing to clobber). Only the golden-fixture cases' CAS
      digests are NOT schema-hex-valid (readability letters, see script
      header) — their logo/readme detail-page fetches gracefully fall back
      to a monogram tile; scripts/demo-fixtures/ digests are genuine
      sha256sums. Either way demo/ is never read by task verify's pipeline
      (schema:validate:rendered renders real p/, not demo/p/), so no
      pre-verify cleanup step is needed.
    cmds:
      - scripts/demo-seed.sh

  demo:clean:
    desc: >-
      Remove demo/ (`rm -rf demo/`) — demo:seed's entire gitignored output
      tree. No git-clean guard needed (unlike the old p/-seeding approach):
      demo/ never holds tracked content, so a blanket removal is always
      safe. Idempotent — a no-op if demo/ doesn't exist.
    cmds:
      - rm -rf demo/

  demo:serve:
    desc: >-
      Convenience chain — demo:clean, demo:seed, then render + serve the
      demo/p/ tree (render:build with RENDER_INDEX_DIR=demo, then
      site:preview) for a one-shot local design review. Pre-cleans so
      repeat runs never accumulate stale demo packages.
    cmds:
      - task: demo:clean
      - task: demo:seed
      - task: render:build
        vars:
          RENDER_INDEX_DIR: demo
      - task: site:preview

  cat:dev:
    desc: >-
      Iterate on @ocx-sh/catalog: build {{.CATALOG_PKG_DIR}}, render
      through ITS CLI (CATALOG_DEV=1), serve the production-shaped result
      on :4173. HMR variant: `task site:dev CATALOG_DEV=1` (no bot pass).
      The inner `task` call is CLI-style so CATALOG_DEV reaches every
      nested task.
    cmds:
      - npm --prefix {{.CATALOG_PKG_DIR}} ci
      - npm --prefix {{.CATALOG_PKG_DIR}} run build
      - task render:build CATALOG_DEV=1
      - task: site:preview

  cat:ci:check:
    desc: >-
      Drift gate for the RENDERED .github/workflows/catalog-ci.yml — exactly
      catalog-ci.yml's own verify-catalog-ci job. That workflow is generated
      by `ocx-catalog ci` from catalog.config.json's `ci` block, so a
      hand-edit to it (or a config change left un-rendered) is drift; this
      re-renders in memory and compares, writing nothing. Re-render with
      `./node_modules/.bin/ocx-catalog ci` and commit the result.
    cmds:
      - bun install --frozen-lockfile
      - '{{.CATALOG_BIN}} ci --check'

  verify:
    desc: >-
      Full gate — the CI job set across both workflows: ci.yml
      (schema-validate, bot-test, bot-workflows, verify-indexbot-ci,
      bot-audit, workflows-lint, render-check) and the rendered catalog-ci.yml (build via site:build,
      verify-catalog-ci via cat:ci:check). ci.yml's golden-baseline job is
      deliberately NOT here: it refuses to run against a dirty working tree
      (its manifest header records HEAD while the pipeline builds the
      working tree), so it would break `task verify` mid-edit — run
      `bash scripts/golden-baseline.sh generate` yourself before pushing.
    cmds:
      - task: schema:validate
      - task: bot:test
      - task: bot:workflows
      - task: bot:ci:check
      - task: bot:audit
      - task: workflows:lint
      - task: cat:ci:check
      - task: site:build
      - task: render:build
      - task: schema:validate:rendered
