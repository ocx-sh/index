# The index bot is a released package (https://pypi.org/p/ocx-indexbot); this
# project exists only to PIN it. `uv.lock` beside this file hashes the whole
# transitive set, and `uv sync --frozen` is what every CI job resolves, so the
# version running in the privileged governance job changes only through a
# reviewed pull request — the same control that governs
# `.github/index-policy.json`.
#
# TEMPORARILY a git source, not a PyPI version. 0.2.0 — the release that makes
# an index's identity, forge and pipelines configurable — is not cut yet, and
# this repository is its dogfood: it renders its own workflows with
# `indexbot ci` and runs the governance lane on the same code the GitLab e2e
# does. The control is unchanged in kind: `uv.lock` records the exact resolved
# commit and `uv sync --frozen` enforces it, so "bump = reviewed lockfile diff"
# still holds. What is genuinely weaker is provenance — a git commit carries no
# Trusted Publishing attestation, and a force-push to indexbot `main` would
# move what a re-lock resolves to. Both are why this is time-boxed: the source
# goes back to `ocx-indexbot==0.2.0` the moment that release lands.
#
# `dev` additionally carries pytest for `tests/security/`: the deployment-
# specific half of the governance suite, which asserts on THIS repository's
# committed workflows and policy and therefore could not travel with the
# package (see ocx-sh/indexbot's docs/reference/workflow-invariants.md).
[project]
name = "index-bot-tools"
version = "0"
description = "Pinned indexbot toolchain + this deployment's own security suite."
requires-python = ">=3.12"
dependencies = ["ocx-indexbot"]

[tool.uv.sources]
ocx-indexbot = { git = "https://github.com/ocx-sh/indexbot.git", branch = "main" }

[dependency-groups]
dev = ["pytest>=8.3", "pip-audit>=2.7"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
